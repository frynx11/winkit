name: Build WinKit Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installer and portable package
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (build machine only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build self-contained WinKit folder
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --windowed --onedir --name WinKit --collect-all PySide6 --collect-submodules psutil main.py
          if (!(Test-Path "dist\WinKit\WinKit.exe")) {
            throw "PyInstaller did not produce dist\WinKit\WinKit.exe"
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\WinKit" -DestinationPath "WinKit_Portable_2.0.0.zip" -CompressionLevel Optimal -Force

      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --no-progress -y
            $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $compiler) { throw "Inno Setup compiler (ISCC.exe) was not found." }
          "path=$compiler" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Compile Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "Output" | Out-Null
          & "${{ steps.inno.outputs.path }}" "build_setup.iss"
          if (!(Test-Path "Output\WinKit_Setup_2.0.0.exe")) {
            throw "Installer output was not created."
          }

      - name: Upload installer and portable package
        uses: actions/upload-artifact@v4
        with:
          name: WinKit-Windows-2.0.0
          path: |
            Output/WinKit_Setup_2.0.0.exe
            WinKit_Portable_2.0.0.zip
          if-no-files-found: error
          retention-days: 14
