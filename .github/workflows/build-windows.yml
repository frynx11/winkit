name: Build WinKit Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # دي بتخلّيك تقدر تشغيل الـ Build يدوياً من زرار في الموقع

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies & PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller (Folder/Portable Mode)
      run: |
        pyinstaller --noconsole --onedir --name "WinKit" main.py

    - name: Compress Portable Version
      run: |
        Compress-Archive -Path "dist\WinKit\*" -DestinationPath "WinKit_Portable_2.0.0.zip"

    - name: Install Inno Setup
      run: |
        choco install innosetup -y

    - name: Compile Inno Setup Installer
      run: |
        # التأكد من مسار الكومبايلر الخاص بـ Inno Setup على سيرفر ويندوز
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "build_setup.iss"
      shell: pwsh

    - name: Upload Build Artifacts (Setup & Portable)
      uses: actions/upload-artifact@v4
      with:
        name: WinKit-Release-Files
        path: |
          WinKit_Portable_2.0.0.zip
          Output/WinKit_Setup_2.0.0.exe
